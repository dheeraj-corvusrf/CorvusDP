<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CorvusDP has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://corvusre.com/corvusdp/">
<link rel="canonical" href="https://corvusre.com/corvusdp/">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdf8f0; color: #1f2937; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 24px; text-align: center; }
  a { color: #d97706; font-weight: 600; }
</style>
<script>
  // Preserve whatever sub-page/query/hash the visitor was on, so a stale
  // link to e.g. /CorvusDP/permitting/ lands on the equivalent real page
  // (corvusre.com/corvusdp/permitting/) instead of just the homepage. The
  // meta-refresh above is the no-JS fallback and can only go to the root.
  var path = location.pathname.replace(/^\/CorvusDP\/?/, "");
  location.replace("https://corvusre.com/corvusdp/" + path + location.search + location.hash);
</script>
</head>
<body>
  <p>CorvusDP has moved to <a href="https://corvusre.com/corvusdp/">corvusre.com/corvusdp/</a>&hellip;</p>
</body>
</html>
