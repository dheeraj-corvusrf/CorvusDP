name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pure permitting / zoning / fee / timeline / design math — no network or
      # browser. A failure here blocks the deploy, same as a failed build.
      - run: npm run test

      # Builds at base "/" and prerenders every route to static HTML. CorvusDP
      # must be served from a domain root (GitHub Pages custom domain, an
      # <account>.github.io site, or Cloudflare/Netlify) — see README. The
      # current TanStack Start static prerender cannot resolve routes under a
      # non-root base path, so a project-site subpath (…github.io/CorvusDP/) is
      # not a valid target without a reverse proxy.
      - run: npm run build
        env:
          # Supabase anon/publishable key is meant to be public (it ships in the
          # client bundle regardless) — real access control is the RLS policies
          # in supabase/schema.sql. Point these at CorvusDP's OWN Supabase
          # project (separate from any other CorvusRE app). Set as repo
          # Variables: Settings > Secrets and variables > Actions > Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ vars.VITE_WEB3FORMS_ACCESS_KEY }}

      # SPA deep-link fallback: GitHub Pages serves 404.html for any path it has
      # no file for. Every route is already prerendered, so this only matters for
      # unlisted paths and query-string variants — it boots the app and lets the
      # client router take over.
      - run: cp dist/client/index.html dist/client/404.html

      # If a custom domain is configured, drop a CNAME so Pages keeps it.
      - name: Add CNAME
        if: ${{ vars.PAGES_CNAME != '' }}
        run: echo "${{ vars.PAGES_CNAME }}" > dist/client/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
